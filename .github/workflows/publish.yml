# Push a tag like v1.0.0 to publish ghcr.io/<owner>/sheen:1.0.0 and :latest
# for Intel/AMD and ARM (Raspberry Pi) machines, then draft a GitHub release.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sheen
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          printf '%s\n\n**Image:** `ghcr.io/%s/sheen:%s@%s`\n' "$notes" "${GITHUB_REPOSITORY_OWNER,,}" "${GITHUB_REF_NAME#v}" "$DIGEST" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Sheen ${GITHUB_REF_NAME#v}" --notes-file notes.md
