server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The page and the service worker must always be revalidated so updates show up.
    location = / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location = /index.html {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Bundled libraries and fonts never change within a release.
    location ~ ^/(vendor|fonts)/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
}
